<!doctype html>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>移動しました</title>
<script>
    // 旧サイトの product-post.html?id=<id> を /works/<id>/ へ
    const id = new URLSearchParams(location.search).get('id');
    location.replace(id && /^[\w-]+$/.test(id) ? '/works/' + id + '/' : '/works/');
</script>
<a href="/works/">移動しました</a>
