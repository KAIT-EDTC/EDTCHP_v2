name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ダッシュボードから来た記事PRも含め、frontmatter（タグ・日付・画像パス）の不備はここで落ちる
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 団体アカウント(kait.edtc@gmail.com)で作った API トークン。アカウントIDは wrangler.jsonc に固定済み
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # PRごとに本番へは反映しないバージョンをアップロードし、プレビューURLをPRにコメントする
  preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: upload
        run: |
          set -o pipefail
          npx wrangler versions upload --preview-alias "pr-${PR_NUMBER}" --message "PR #${PR_NUMBER}" | tee upload.log
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -n1 || true)
          if [ -z "$url" ]; then
            echo "::error::プレビューURLが出力されませんでした。Worker の preview_urls が有効か確認してください（npx wrangler triggers deploy で反映される）"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - if: steps.upload.outputs.url != ''
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "🔍 プレビュー: $URL

          （最新コミット ${HEAD_SHA::7} の内容。本番には反映されていません）"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
